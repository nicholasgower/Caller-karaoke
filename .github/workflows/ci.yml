name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only the long-lived branches write caches. PR runs still restore
          # them, but must not fill the 10 GB repo cache quota, which would
          # evict the entries that keep CI and Release fast.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libgtk-3-dev libspeechd-dev speech-dispatcher
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check the development MCP path
        run: cargo check -p contra-app --features inspection

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libgtk-3-dev libspeechd-dev speech-dispatcher
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match the pin in rust-toolchain.toml: the repository override wins
      # over any other installed toolchain, so the wasm target has to belong to
      # 1.100.0 or cargo cannot find `core` for the target.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo check -p contra-app --target wasm32-unknown-unknown
      - name: Install Trunk
        run: |
          curl -L --fail --retry 3 \
            -o trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          sudo mv trunk /usr/local/bin/
      - run: cd crates/web && trunk build --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default install list includes the legacy `tools`
          # package, which sdkmanager 16.0 can no longer resolve ("Failed to
          # find package 'tools'"), failing the job before our own SDK step
          # runs. The step below installs everything this build needs.
          packages: ""
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build debug APK
        run: python3 packaging/android/build-apk.py --debug

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: the deny action runs inside its own container, which
      # mounts only the workspace, so the host ~/.cargo and target/ caches are
      # never read. Caching them just stores ~0.1 GB and adds restore time.
      # `arguments` is inserted *before* the subcommand and `command-arguments`
      # *after* it. cargo-deny 0.21 (the version the v2 action container now
      # ships) moved the -A/-W/-D lint flags from the root CLI onto `check`,
      # so a lint level passed as `arguments` fails with
      # "unexpected argument '-A' found". Keep lint levels in
      # `command-arguments`; `arguments` keeps its `--all-features` default.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: -A warnings
