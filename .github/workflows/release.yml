name: Release

# Releases are cut by hand. `scripts/release.mjs` bumps the workspace version,
# commits it and pushes main, then starts this workflow. Every platform is built
# first; only then does the final release job create the v<version> tag and the
# release, so a tag never exists before its artifacts do. A last job then
# publishes the library crates to crates.io from that tag. Pushing a branch or a
# tag never publishes anything on its own.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the workspace version
        id: read
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p caller-app
      - name: Portable ZIP
        shell: pwsh
        run: |
          $name = "CallerKaraoke-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/caller-karaoke.exe dist/portable
          Copy-Item LICENSE,README.md,CREDITS.md,CHANGELOG.md dist/portable
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            packaging/windows/caller-karaoke.iss `
            "/DAppVersion=$env:VERSION" `
            "/DOutputBaseFilename=CallerKaraoke-$env:VERSION-windows-x64-setup"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libgtk-3-dev libspeechd-dev speech-dispatcher
      - name: Build release
        run: cargo build --release -p caller-app
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Debian package
        run: cargo deb -p caller-app --no-build
      - name: AppImage
        run: VERSION="$VERSION" bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            dist/CallerKaraoke-*.AppImage

  web:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Must match the pin in rust-toolchain.toml; see the wasm job in ci.yml.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -L --fail --retry 3 \
            -o trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          sudo mv trunk /usr/local/bin/
      - name: Build web app
        run: cd crates/web && trunk build --release
      - name: Package web app
        run: |
          cd dist
          zip -r "caller-karaoke-$VERSION-web.zip" web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*-web.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default install list includes the legacy `tools`
          # package, which sdkmanager 16.0 can no longer resolve ("Failed to
          # find package 'tools'"), failing the job before our own SDK step
          # runs. The step below installs everything this build needs.
          packages: ""
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        # The script uses the debug keystore unless
        # CARGO_APK_RELEASE_KEYSTORE and CARGO_APK_RELEASE_KEYSTORE_PASSWORD
        # are configured as CI secrets.
        run: python3 packaging/android/build-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/release/apk/caller-karaoke.apk
          if-no-files-found: error

  release:
    needs: [version, windows, linux, web, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version is not already released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Bump the version for a new release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          # Merged artifacts keep their internal layout (dist/, target/), so
          # checksum the files, not the top-level entries.
          find . -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Release notes
        shell: bash
        run: |
          {
            echo "Caller Karaoke ${VERSION}."
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # The tag is created here, at the commit that was built, so it appears
          # at the same moment as the artifacts rather than at release start.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Caller Karaoke v${{ needs.version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true

  crates:
    # The library crates follow the app release, but only after the tag exists:
    # a crates.io version is immutable (yanking is the only undo), so it must
    # never be published for a version whose platform builds failed. A failure
    # here leaves the release intact and can be retried by re-running the job;
    # scripts/publish-crates.mjs skips anything already on crates.io.
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish from the tagged commit, not from a moving branch. Full
          # history also fetches the tag ref that publish-crates.mjs checks.
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Add the CARGO_REGISTRY_TOKEN repository secret (a crates.io API token)" >&2
            echo "to publish caller-core and caller-sources with a release." >&2
            exit 1
          fi
      - name: Publish the library crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish-crates.mjs --yes --allow-branch
