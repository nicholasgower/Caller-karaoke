name: Release

# Releases are cut by hand. `scripts/release.mjs` bumps the workspace version,
# commits it, tags v<version>, and pushes the tag; this workflow then builds the
# artifacts and publishes them as that release. Pushing to a branch never
# publishes anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the workspace version
        id: read
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p contra-app
      - name: Portable ZIP
        shell: pwsh
        run: |
          $name = "ContraKaraoke-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/contra-karaoke.exe dist/portable
          Copy-Item LICENSE,README.md,CREDITS.md,CHANGELOG.md dist/portable
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            packaging/windows/contra-karaoke.iss `
            "/DAppVersion=$env:VERSION" `
            "/DOutputBaseFilename=ContraKaraoke-$env:VERSION-windows-x64-setup"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libgtk-3-dev libspeechd-dev speech-dispatcher
      - name: Build release
        run: cargo build --release -p contra-app
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Debian package
        run: cargo deb -p contra-app --no-build
      - name: AppImage
        run: VERSION="$VERSION" bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            dist/ContraKaraoke-*.AppImage

  web:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Must match the pin in rust-toolchain.toml; see the wasm job in ci.yml.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -L --fail --retry 3 \
            -o trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          sudo mv trunk /usr/local/bin/
      - name: Build web app
        run: cd crates/web && trunk build --release
      - name: Package web app
        run: |
          cd dist
          zip -r "contra-karaoke-$VERSION-web.zip" web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*-web.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default install list includes the legacy `tools`
          # package, which sdkmanager 16.0 can no longer resolve ("Failed to
          # find package 'tools'"), failing the job before our own SDK step
          # runs. The step below installs everything this build needs.
          packages: ""
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        # The script uses the debug keystore unless
        # CARGO_APK_RELEASE_KEYSTORE and CARGO_APK_RELEASE_KEYSTORE_PASSWORD
        # are configured as CI secrets.
        run: python3 packaging/android/build-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/release/apk/contra-karaoke.apk
          if-no-files-found: error

  release:
    needs: [version, windows, linux, web, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v${VERSION} in Cargo.toml" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          # Merged artifacts keep their internal layout (dist/, target/), so
          # checksum the files, not the top-level entries.
          find . -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Release notes
        shell: bash
        run: |
          {
            echo "Contra Karaoke ${VERSION}."
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Contra Karaoke v${{ needs.version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
