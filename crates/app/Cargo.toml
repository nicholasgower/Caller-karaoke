[package]
name = "contra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Contra dance caller trainer with ABC music playback and early call timing"
build = "build.rs"
# `contra-headless` is a development-only helper behind the `headless` feature;
# plain `cargo run -p contra-app` must launch the real app.
default-run = "contra-karaoke"

[lib]
name = "contra_app"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "contra-karaoke"
path = "src/main.rs"

[[bin]]
name = "contra-headless"
path = "src/bin/contra-headless.rs"
required-features = ["headless"]

[[bin]]
name = "contra-perf"
path = "src/bin/contra-perf.rs"
required-features = ["headless"]

[features]
# Development-only: lets `contra-mcp` attach to a running app and drive it.
# Off by default so release artifacts do not carry the inspection listener.
inspection = ["eframe/inspection"]
# Development-only: renders the real app without a window or audio device.
headless = ["dep:egui_kittest"]

[dependencies]
acorde.workspace = true
acorde-render-svg.workspace = true
arc-swap.workspace = true
contra-core = { version = "0.1.0", path = "../core" }
contra-music = { version = "0.1.0", path = "../music" }
contra-sources = { version = "0.1.0", path = "../sources" }
cpal.workspace = true
directories.workspace = true
egui_kittest = { workspace = true, optional = true }
ehttp.workspace = true
epaint_default_fonts.workspace = true
flate2.workspace = true
percent-encoding.workspace = true
resvg.workspace = true
rustysynth.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tts.workspace = true
web-time.workspace = true

[target.'cfg(all(windows, not(target_arch = "wasm32")))'.dependencies]
misaki-rs.workspace = true
ort = { workspace = true, features = ["std", "load-dynamic", "api-31"] }
raw-window-handle.workspace = true
souvlaki.workspace = true
ureq.workspace = true

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
misaki-rs.workspace = true
ort = { workspace = true, features = ["std", "load-dynamic", "api-31"] }
souvlaki = { workspace = true, features = ["use_zbus"] }
tar = "0.4"
ureq.workspace = true

# Tests drive the real app through egui_kittest without the `headless`
# feature. The screenshot renderer keeps the wgpu renderer; unit tests only
# need the eframe harness, so they do not pull in a GPU backend.
[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false, features = ["eframe"] }

[build-dependencies]
sha2.workspace = true
ureq.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger.workspace = true
# Decodes the bundled window icon; the headless renderer also saves PNGs.
image.workspace = true
rfd.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
# accesskit_winit does not support the native-activity backend, so Android
# builds eframe without accessibility until the game-activity backend is used.
eframe = { workspace = true, features = ["accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe.workspace = true
# The media session lives in MainActivity.java; Rust publishes metadata and
# playback state to it and receives transport commands over JNI.
jni = "0.21"
log = "0.4"
# The local Kokoro voice uses the same ONNX Runtime and G2P as the desktop
# build. The runtime is packaged into the APK by packaging/android/build-apk.py
# and loaded from the native library directory.
misaki-rs.workspace = true
ndk-context = "0.1"
ort = { workspace = true, features = ["std", "load-dynamic", "api-31"] }
ureq.workspace = true
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
cpal = { workspace = true, features = ["wasm-bindgen"] }
log = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# The extra features cover downloading exported text (Blob and an anchor) and
# the browser's file picker (`<input type=file>`).
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Location",
  "Navigator",
  "Node",
  "Storage",
  "Url",
  "Window",
] }

[package.metadata.android]
package = "org.contrakaraoke.app"
apk_name = "contra-karaoke"
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
resources = "../../packaging/android/res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Android 13+ gates the media notification behind a runtime permission. The
# session, and therefore headset, Bluetooth, and lock-screen control, works
# without it; MainActivity requests it at startup so the notification can show.
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "Contra Karaoke"
icon = "@mipmap/ic_launcher"
# The tts crate's Android backend calls into rs.tts.Bridge, which is packaged
# as classes.dex by packaging/android/build-apk.py.
has_code = true
# The ONNX Runtime shared library is added to the APK after cargo-apk builds
# it. Extraction makes the compressed library available in nativeLibraryDir,
# where the dynamic loader can find it by soname.
extract_native_libs = true

[package.metadata.android.application.activity]
# Load the native library from an app class so JNI_OnLoad's FindClass uses the
# app class loader and can see rs.tts.Bridge.
name = "org.contrakaraoke.app.MainActivity"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.deb]
maintainer = "Nicholas Gower <nicholasgower01@gmail.com>"
copyright = "2026, Nicholas Gower"
license-file = ["../../LICENSE", "0"]
extended-description = "Contra dance caller trainer with ABC music playback, early call timing, aliases, and role terms."
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
  ["target/release/contra-karaoke", "usr/bin/", "755"],
  # Asset paths are relative to this crate's directory, so workspace-root
  # paths need the same `../../` prefix as `license-file`.
  ["../../packaging/linux/contra-karaoke.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/contra-karaoke-16.png", "usr/share/icons/hicolor/16x16/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke-32.png", "usr/share/icons/hicolor/32x32/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke-48.png", "usr/share/icons/hicolor/48x48/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke-64.png", "usr/share/icons/hicolor/64x64/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke-128.png", "usr/share/icons/hicolor/128x128/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke-256.png", "usr/share/icons/hicolor/256x256/apps/contra-karaoke.png", "644"],
  ["../../assets/icons/contra-karaoke.svg", "usr/share/icons/hicolor/scalable/apps/contra-karaoke.svg", "644"],
]
