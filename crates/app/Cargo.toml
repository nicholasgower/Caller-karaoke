[package]
name = "contra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "contra-karaoke"
path = "src/main.rs"

[dependencies]
arc-swap.workspace = true
contra-core = { path = "../core" }
contra-music = { path = "../music" }
contra-sources = { path = "../sources" }
cpal.workspace = true
directories.workspace = true
eframe.workspace = true
ehttp.workspace = true
env_logger.workspace = true
percent-encoding.workspace = true
rfd.workspace = true
rustysynth.workspace = true
serde_json.workspace = true
tts.workspace = true

[package.metadata.deb]
maintainer = "Nicholas Gower <nicholasgower01@gmail.com>"
copyright = "2026, Nicholas Gower"
license-file = ["../../LICENSE", "0"]
extended-description = "Contra dance caller trainer with ABC music playback, early call timing, aliases, and role terms."
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
  ["target/release/contra-karaoke", "usr/bin/", "755"],
  ["packaging/linux/contra-karaoke.desktop", "usr/share/applications/", "644"],
]
