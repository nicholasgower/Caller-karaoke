[package]
name = "contra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Contra dance caller trainer with ABC music playback and early call timing"

[lib]
name = "contra_app"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "contra-karaoke"
path = "src/main.rs"

[features]
# Development-only: lets `contra-mcp` attach to a running app and drive it.
# Off by default so release artifacts do not carry the inspection listener.
inspection = ["eframe/inspection"]

[dependencies]
acorde.workspace = true
acorde-render-svg.workspace = true
arc-swap.workspace = true
contra-core = { version = "0.1.0", path = "../core" }
contra-music = { version = "0.1.0", path = "../music" }
contra-sources = { version = "0.1.0", path = "../sources" }
cpal.workspace = true
directories.workspace = true
eframe.workspace = true
ehttp.workspace = true
epaint_default_fonts.workspace = true
percent-encoding.workspace = true
resvg.workspace = true
rustysynth.workspace = true
serde_json.workspace = true
tts.workspace = true

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
cpal = { workspace = true, features = ["wasm-bindgen"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Storage", "Window"] }

[package.metadata.android]
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.deb]
maintainer = "Nicholas Gower <nicholasgower01@gmail.com>"
copyright = "2026, Nicholas Gower"
license-file = ["../../LICENSE", "0"]
extended-description = "Contra dance caller trainer with ABC music playback, early call timing, aliases, and role terms."
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
  ["target/release/contra-karaoke", "usr/bin/", "755"],
  ["packaging/linux/contra-karaoke.desktop", "usr/share/applications/", "644"],
]
