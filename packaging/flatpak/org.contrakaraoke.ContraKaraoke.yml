app-id: org.contrakaraoke.ContraKaraoke
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: contra-karaoke
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Speech.Dispatcher
modules:
  - name: contra-karaoke
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --offline -p contra-app
      - install -Dm755 target/release/contra-karaoke /app/bin/contra-karaoke
      - install -Dm644 packaging/linux/contra-karaoke.desktop /app/share/applications/org.contrakaraoke.ContraKaraoke.desktop
      - install -Dm644 assets/icons/contra-karaoke.svg /app/share/icons/hicolor/scalable/apps/contra-karaoke.svg
      - install -Dm644 assets/icons/contra-karaoke-256.png /app/share/icons/hicolor/256x256/apps/contra-karaoke.png
      - install -Dm644 LICENSE /app/share/licenses/org.contrakaraoke.ContraKaraoke/LICENSE
      - install -Dm644 CREDITS.md /app/share/doc/org.contrakaraoke.ContraKaraoke/CREDITS.md
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
