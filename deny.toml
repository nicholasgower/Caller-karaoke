[graph]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
# These are transitive "unmaintained" notices from winit/accesskit's Linux
# accessibility stack, not vulnerabilities. Track upstream rather than pinning
# an older egui/winit stack.
ignore = [
  "RUSTSEC-2026-0192", # ttf-parser (winit sctk-adwaita)
  "RUSTSEC-2026-0371", # zbus_names (accesskit)
  "RUSTSEC-2026-0370", # zvariant (accesskit)
  "RUSTSEC-2026-0372", # zvariant_derive (accesskit)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
