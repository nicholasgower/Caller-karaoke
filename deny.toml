[graph]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CC0-1.0",
  "WTFPL",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
# These are transitive "unmaintained" notices from winit/accesskit's Linux
# accessibility stack, not vulnerabilities. Track upstream rather than pinning
# an older egui/winit stack.
ignore = [
  "RUSTSEC-2026-0192", # ttf-parser (winit sctk-adwaita)
  "RUSTSEC-2026-0371", # zbus_names (accesskit)
  "RUSTSEC-2026-0370", # zvariant (accesskit)
  "RUSTSEC-2026-0372", # zvariant_derive (accesskit)
  # chrono was soft-deprecated upstream (chronotope/chrono#1768) and the RustSec
  # unmaintained advisory landed on 2026-11-17. It is not in the app's tree:
  # `cargo tree -p caller-app -i chrono` is empty. It arrives only through the
  # development-only caller-mcp crate, from rmcp's model timestamps and the
  # schemars `chrono04` feature rmcp enables. Track rmcp's own migration
  # (modelcontextprotocol/rust-sdk#1469) instead of forking a crate we never
  # call, and drop this entry once rmcp ships without it.
  { id = "RUSTSEC-2026-0543", reason = "dev-only transitive dep of caller-mcp (rmcp timestamps)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
