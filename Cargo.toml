[workspace]
members = ["crates/core", "crates/music", "crates/sources", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Nicholas Gower"]
rust-version = "1.95"
repository = "https://github.com/storytold/Contra-karaoke"

[workspace.dependencies]
abc-parser = "0.4"
arc-swap = "1"
cpal = "0.18"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "links", "wayland", "x11"] }
ehttp = "0.7"
env_logger = "0.11"
midly = "0.5"
percent-encoding = "2"
regex = "1"
rfd = "0.18"
rustysynth = "1.3"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tts = "0.26"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
