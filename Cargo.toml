[workspace]
members = [
    "crates/core",
    "crates/music",
    "crates/sources",
    "crates/app",
    "crates/web",
    "crates/mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Nicholas Gower"]
rust-version = "1.95"
repository = "https://github.com/storytold/Contra-karaoke"

[workspace.dependencies]
abc-parser = "0.4"
acorde = { version = "=1.3.12", default-features = false, features = ["abc"] }
acorde-render-svg = "=1.3.12"
arc-swap = "1"
cpal = "0.18"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "links", "wayland", "x11", "android-native-activity"] }
egui_kittest = { version = "0.37", default-features = false, features = ["eframe", "wgpu"] }
egui_mcp = "0.3"
ehttp = "0.7"
env_logger = "0.11"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
midly = "0.5"
misaki-rs = { version = "0.3", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false }
percent-encoding = "2"
raw-window-handle = "0.6"
regex = "1"
resvg = { version = "0.48", default-features = false, features = ["text"] }
rfd = "0.18"
rustysynth = "1.3"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
souvlaki = { version = "0.9", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tts = "0.26"
ureq = "3"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
